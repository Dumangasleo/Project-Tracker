# Local infrastructure for Vortex Sync.
# Only RabbitMQ lives here — your MSSQL stays wherever you already run it.
#
#   docker compose up -d          # start RabbitMQ
#   http://localhost:15672        # management UI (login: guest / guest)
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: vortex-rabbitmq
    ports:
      - "5672:5672"     # AMQP (used by the app)
      - "15672:15672"   # Management UI (browser)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
